function validateState(s){if(!s||typeof s!=='object'||s.version!==VERSION||!s.meta||typeof s.meta.demo!=='boolean'||!s.config||typeof s.config.company!=='string'||typeof s.config.operator!=='string'||!Array.isArray(s.products)||!Array.isArray(s.materials)||!Array.isArray(s.customers)||!Array.isArray(s.production)||!Array.isArray(s.sales)||!Array.isArray(s.returns)||!Array.isArray(s.adjustments)||!Array.isArray(s.collections))throw Error('El respaldo tiene un formato incompatible o incompleto.');if(!['BOB','USD','BRL'].includes(s.config.currency))throw Error('Moneda inválida.');for(const k of ['products','materials'])for(const item of s[k])if(typeof item.id!=='string'||!Number.isSafeInteger(item.stock)||item.stock<0)throw Error('Inventario inválido en '+k);for(const p of s.products){if(typeof p.name!=='string'||typeof p.sku!=='string'||typeof p.active!=='boolean'||!PACKAGE[p.package]||!Number.isFinite(p.price)||p.price<0||!Number.isSafeInteger(p.minStock)||p.minStock<0)throw Error('Producto inválido: '+p.id)}for(const c of s.customers)if(typeof c.id!=='string'||typeof c.name!=='string'||typeof c.phone!=='string'||typeof c.address!=='string')throw Error('Cliente inválido.');for(const sale of s.sales){if(!Array.isArray(sale.items)||!Number.isFinite(sale.total)||sale.total<0||!['paid','pending'].includes(sale.paymentStatus)||!Number.isFinite(Date.parse(sale.createdAt))||!s.customers.some(c=>c.id===sale.customerId))throw Error('Venta inválida.');for(const item of sale.items)if(!Number.isSafeInteger(item.qty)||item.qty<=0||!Number.isFinite(item.price)||item.price<0||!PACKAGE[item.package||s.products.find(p=>p.id===item.productId)?.package])throw Error('Detalle de venta inválido.')}for(const r of s.returns){if(!s.customers.some(c=>c.id===r.customerId)||!Number.isSafeInteger(r.good)||r.good<0||!Number.isSafeInteger(r.damaged)||r.damaged<0||!Number.isFinite(Date.parse(r.createdAt)))throw Error('Registro de retorno inválido.')}for(const prod of s.production)if(!Number.isSafeInteger(prod.qty)||prod.qty<1||!Number.isFinite(Date.parse(prod.createdAt)))throw Error('Lote inválido.');for(const adj of s.adjustments)if(!Number.isSafeInteger(adj.delta)||!Number.isFinite(Date.parse(adj.createdAt)))throw Error('Movimiento inválido.');const ids=new Set();for(const p of s.products){if(ids.has(p.id))throw Error('ID de producto duplicado.');ids.add(p.id)}const issues=integrityIssues(s);if(issues.length)throw Error('Integridad de registros: '+issues.slice(0,3).join('; '));return true}
function integrityIssues(s){
 const issues=[];const ids=new Set();
 const unique=(arr,label)=>{for(const item of arr){if(!item||typeof item.id!=='string'||!item.id||ids.has(label+item.id))issues.push('Identificador repetido o vacío en '+label);ids.add(label+(item?.id||''));}};
 for(const [label,arr] of [['clientes',s.customers],['materiales',s.materials],['productos',s.products],['ventas',s.sales],['lotes',s.production],['retornos',s.returns],['cobros',s.collections],['ajustes',s.adjustments]])unique(arr,label);
 const productIds=new Set(s.products.map(x=>x.id)),customerIds=new Set(s.customers.map(x=>x.id)),materialIds=new Set(s.materials.map(x=>x.id));
 const saleIds=new Set(s.sales.map(x=>x.id));const byCustomer=new Map();
 for(const sale of s.sales){
  if(!customerIds.has(sale.customerId))issues.push('Venta con cliente inexistente');
  if(!sale.id||!sale.code||typeof sale.currency!=='string'||!['BOB','USD','BRL'].includes(sale.currency))issues.push('Venta sin código o moneda válida');
  if(!Number.isInteger(sale.returnsReceived||0)||sale.returnsReceived<0)issues.push('Devolución en venta inválida');
  let total=0,ret=0;
  for(const item of sale.items||[]){if(!productIds.has(item.productId))issues.push('Venta con producto inexistente');total+=Math.round(item.price*item.qty*100);if(PACKAGE[item.package]?.returnable)ret+=item.qty;}
  if(Math.abs(total-Math.round(sale.total*100))>0)issues.push('Total de venta no coincide con sus líneas: '+sale.code);
  byCustomer.set(sale.customerId,(byCustomer.get(sale.customerId)||0)+ret);
 }
 const collectionsBySale=new Map();
 for(const payment of s.collections){if(!saleIds.has(payment.saleId))issues.push('Cobro sin venta asociada');if(!Number.isFinite(payment.amount)||payment.amount<0)issues.push('Cobro con importe inválido');collectionsBySale.set(payment.saleId,(collectionsBySale.get(payment.saleId)||0)+payment.amount);}
 for(const sale of s.sales){const paid=collectionsBySale.get(sale.id)||0;if(sale.paymentStatus==='pending'&&paid>0)issues.push('Venta pendiente con cobro aplicado: '+sale.code);if(sale.paymentStatus==='paid'&&!sale.initiallyPaid&&Math.abs(paid-sale.total)>.005)issues.push('Venta cobrada sin conciliación: '+sale.code);}
 for(const ret of s.returns){if(!customerIds.has(ret.customerId))issues.push('Retorno con cliente inexistente');if(ret.saleId&&!saleIds.has(ret.saleId))issues.push('Retorno vinculado a venta inexistente');byCustomer.set(ret.customerId,(byCustomer.get(ret.customerId)||0)-(ret.good+ret.damaged));}
 for(const [customerId,balance] of byCustomer)if(balance<0)issues.push('Cliente con más botellones devueltos que entregados: '+(s.customers.find(c=>c.id===customerId)?.name||customerId));
 for(const lot of s.production){if(!productIds.has(lot.productId))issues.push('Lote con producto inexistente');}
 for(const adjustment of s.adjustments){if(!((adjustment.type==='producto'&&productIds.has(adjustment.itemId))||(adjustment.type==='material'&&materialIds.has(adjustment.itemId))))issues.push('Ajuste con artículo inexistente');}
 if(!Number.isSafeInteger(s.rev)||s.rev<0)issues.push('Revisión de datos inválida');
 return [...new Set(issues)];
}
function diagnostics(){const issues=integrityIssues(state);return {issues,records:state.sales.length+state.production.length+state.returns.length+state.adjustments.length+state.collections.length,revision:state.rev,updatedAt:state.meta.updatedAt};}

function debt(id){const sold=sum(state.sales.filter(s=>s.customerId===id),soldReturnable);const back=sum(state.returns.filter(r=>r.customerId===id),r=>r.good+r.damaged);return Math.max(0,sold-back)}

function lowAlerts(){return [...state.products.filter(p=>p.active&&p.stock<=p.minStock).map(p=>({label:p.name+' · stock bajo ('+p.stock+')',where:'inventario'})),...state.materials.filter(m=>m.id!=='danados'&&m.stock<=m.minStock).map(m=>({label:m.name+' · stock bajo ('+m.stock+')',where:'inventario'}))]}
function activities(){return [...state.production.map(p=>({kind:'produccion',id:p.id,title:'Lote '+p.code,desc:p.qty+' unidades · '+(getP(p.productId)?.name||'Producto'),date:p.createdAt,value:'Finalizado'})),...state.sales.map(s=>({kind:'ventas',id:s.id,title:'Venta '+s.code,desc:getC(s.customerId)?.name||'Cliente',date:s.createdAt,value:money(s.total)})),...state.returns.map(r=>({kind:'retornos',id:r.id,title:'Retorno de botellones',desc:(getC(r.customerId)?.name||'Cliente')+' · '+(r.good+r.damaged)+' un.',date:r.createdAt,value:'Recibido'})),...state.adjustments.map(a=>({kind:'inventario',id:a.id,title:'Ajuste de inventario',desc:a.label+' · '+(a.delta>0?'+':'')+a.delta+' un.',date:a.createdAt,value:'Registrado'}))].sort((a,b)=>b.date.localeCompare(a.date))}
function navBtns(){document.getElementById('sidebar-nav').innerHTML=NAV.map(([id,label,ic])=>`<button type="button" class="nav-btn ${page===id?'active':''}" data-nav="${id}" ${page===id?'aria-current="page"':''}>${icon(ic)}<span>${esc(label)}</span></button>`).join('');const MN=[['inicio','Inicio','home'],['tienda','Tienda','shopping-bag'],['ventas','Ventas','receipt'],['inventario','Stock','boxes'],['more','Más','more']];document.getElementById('mobile-nav').innerHTML=MN.map(([id,label,ic])=>`<button type="button" data-nav="${id}" class="${page===id||id==='more'&&!MN.some(x=>x[0]===page)?'active':''}" aria-label="${label}">${icon(ic)}<span>${label}</span></button>`).join('')}
function productCard(p){const q=cart[p.id]||0;return `<article class="product-tile"><div class="product-art">${bottle(PACKAGE[p.package].art,'tile'+p.id)}</div><h3>${esc(p.name)}</h3><div class="detail">${esc(PACKAGE[p.package].label)}</div><div class="price">${money(p.price)}</div><div class="tile-bottom"><span class="tiny-stk">Stock: ${num(p.stock)}</span>${stepper(p.id,q,p.stock)}</div></article>`}
function stepper(id,q,stock){return `<div class="stepper" aria-label="Cantidad en carrito"><button type="button" data-action="qty" data-id="${esc(id)}" data-delta="-1" aria-label="Quitar una unidad">−</button><span aria-live="polite">${q}</span><button type="button" data-action="qty" data-id="${esc(id)}" data-delta="1" ${q>=stock?'disabled':''} aria-label="Agregar una unidad">+</button></div>`}
function actRows(limit=5){const arr=activities().slice(0,limit);return arr.length?`<div class="activity">${arr.map(a=>`<div class="activity-row"><span class="activity-icon">${icon(a.kind==='produccion'?'factory':a.kind==='ventas'?'receipt':a.kind==='retornos'?'refresh':'boxes')}</span><div class="activity-text"><strong>${esc(a.title)}</strong><small>${esc(a.desc)} · ${fmtDate(a.date)}</small></div><div class="activity-trail">${esc(a.value)}</div></div>`).join('')}</div>`:blank('Sin movimientos todavía','Cuando registres producción o ventas, aparecerán aquí.','receipt')}
function kpi(label,value,extra,ic){return `<div class="card kpi"><div class="kpi-top"><span>${esc(label)}</span><span class="kpi-icon">${icon(ic)}</span></div><strong>${esc(value)}</strong><small>${esc(extra)}</small></div>`}
function home(){const todayProd=sum(state.production.filter(p=>isToday(p.createdAt)),p=>p.qty),todaysales=state.sales.filter(x=>isToday(x.createdAt)),totToday=sum(todaysales,s=>s.total),stock=sum(state.products,p=>p.stock),pending=sum(state.customers,c=>debt(c.id));const top=state.products.filter(p=>p.active).slice(0,3);return `<section class="hero"><div class="hero-content"><span class="kicker">${esc(state.config.company)} · Agua purificada</span><h2>El control de tu planta,<br>en tus manos.</h2><p>Producción, pedidos, inventario y botellones retornables, conectados en una sola operación.</p><div class="hero-buttons"><button class="btn btn-light" data-action="open-production">${icon('plus')} Nueva producción</button><button class="btn btn-outline" data-nav="tienda">${icon('shopping-bag')} Hacer pedido</button></div></div><span class="hero-info">20 L · Calidad y control</span>${bottle('jug','heromaster')}</section><section class="kpis" aria-label="Indicadores de operación">${kpi('Producción de hoy',num(todayProd),'Unidades liberadas','factory')}${kpi('Ventas de hoy',money(totToday),`${num(todaysales.length)} transacciones`,'wallet')}${kpi('Unidades terminadas',num(stock),'Stock de producto disponible','package')}${kpi('Botellones por retornar',num(pending),'Saldo en poder de clientes','refresh')}</section><div class="home-grid"><section class="card panel"><div class="section-bar"><div><h2>Especialmente para ti</h2><p>Tu catálogo, listo para vender</p></div><button class="btn btn-sm btn-soft" data-nav="tienda">Ver catálogo →</button></div>${top.length?`<div class="product-grid">${top.map(productCard).join('')}</div>`:blank('Sin productos','Crea productos desde configuración.')}${Object.values(cart).some(q=>q>0)?`<div style="margin-top:13px"><button class="btn btn-primary btn-full" data-action="checkout">Revisar carrito · ${money(cartTotal())}</button></div>`:''}</section><section class="card panel"><div class="section-bar"><div><h2>Actividad reciente</h2><p>Movimientos actualizados</p></div><button class="btn btn-sm btn-outline" data-nav="reportes">Reportes</button></div>${actRows(5)}</section></div>`}
function shop(){const all=state.products.filter(p=>p.active);const categories=['Todas','20 L','2 L','600 mL'];const filtered=all.filter(p=>(category==='Todas'||PACKAGE[p.package].category===category)&&p.name.toLowerCase().includes(search.toLowerCase()));return `<div class="section-bar"><div><h2>Catálogo de agua</h2><p>Selecciona formatos y cantidades para preparar la venta</p></div></div><div class="category-row" role="group" aria-label="Categorías">${categories.map((c,i)=>`<button type="button" data-action="category" data-id="${c}" class="category-card ${category===c?'active':''}"><span class="cat-art">${i===0?icon('drop',35):bottle(i===1?'jug':'small','cat'+i)}</span><span>${c}</span></button>`).join('')}</div><div class="shop-layout"><div><div class="toolbar"><div class="search-wrap">${icon('search')}<input aria-label="Buscar producto" placeholder="Buscar por nombre" value="${esc(search)}" data-action="search" id="shop-search"></div><span class="muted" style="font-size:12px">${filtered.length} productos</span></div><section class="card shop-products">${filtered.length?filtered.map(p=>`<article class="shop-row"><div class="shop-art">${bottle(PACKAGE[p.package].art,'list'+p.id)}</div><div class="shop-description"><h3>${esc(p.name)} ${p.stock<=p.minStock?'<span class="stock-badge low">Stock bajo</span>':''}</h3><p>${esc(PACKAGE[p.package].label)} · SKU ${esc(p.sku)}</p><span class="price">${money(p.price)}</span><div style="margin-top:5px"><small>Disponible: ${num(p.stock)}</small></div></div>${stepper(p.id,cart[p.id]||0,p.stock)}</article>`).join(''):blank('Sin productos en esta categoría','Prueba otra categoría o búsqueda.','search')}</section></div><aside class="card cart-panel" id="cart-panel">${cartContent()}</aside></div>`}
function cartContent(){const lines=cartLines();return `<div class="section-bar"><div><h2>Tu pedido</h2><p>${num(sum(lines,l=>l.qty))} unidades seleccionadas</p></div>${lines.length?`<button type="button" class="btn btn-sm btn-outline" data-action="clear-cart">Vaciar</button>`:''}</div>${lines.length?lines.map(p=>`<div class="cart-line"><div><strong>${esc(p.name)}</strong><br><small>${p.qty} × ${money(p.price)}</small></div><strong>${money(p.subtotal)}</strong></div>`).join(''):`${blank('El carrito está vacío','Utiliza los botones + para añadir productos.','shopping-bag')}`}<div class="cart-footer"><div class="cart-total"><span>Total estimado</span><strong>${money(cartTotal())}</strong></div><button class="btn btn-primary btn-full" data-action="checkout" ${!lines.length?'disabled':''}>${icon('check')} Continuar venta</button><p class="cart-subtitle">El inventario se descuenta únicamente cuando confirmas la venta.</p></div>`}
function table(headers,body){return `<div class="table-scroll"><table class="data-table"><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`}
function salesView(){let arr=[...state.sales].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(listsFilter==='pending')arr=arr.filter(s=>s.paymentStatus==='pending');if(listsFilter==='paid')arr=arr.filter(s=>s.paymentStatus==='paid');return `<div class="toolbar"><div class="filters"><button data-action="filter" data-id="all" class="pill ${listsFilter==='all'?'active':''}">Todas</button><button data-action="filter" data-id="paid" class="pill ${listsFilter==='paid'?'active':''}">Pagadas</button><button data-action="filter" data-id="pending" class="pill ${listsFilter==='pending'?'active':''}">Pendientes</button></div><button class="btn btn-primary" data-nav="tienda">${icon('plus')} Nueva venta</button></div><div class="card panel">${arr.length?table(['Fecha / Nº','Cliente','Unidades','Total','Cobro','Acciones'],arr.map(s=>`<tr><td><strong>${esc(s.code)}</strong><small>${fmtDate(s.createdAt)}</small></td><td>${esc(getC(s.customerId)?.name||'Cliente eliminado')}</td><td>${num(sum(s.items,i=>i.qty))}</td><td><strong>${money(s.total)}</strong></td><td><span class="badge ${s.paymentStatus==='pending'?'pending':''}">${s.paymentStatus==='pending'?'Por cobrar':'Pagado'}</span></td><td><button class="btn btn-sm btn-outline" data-action="sale-detail" data-id="${esc(s.id)}">Detalle</button>${s.paymentStatus==='pending'?` <button class="btn btn-sm btn-soft" data-action="collect" data-id="${esc(s.id)}">Cobrar</button>`:''}</td></tr>`).join('')):blank('No hay ventas registradas','Comienza en Tienda y confirma el primer pedido.','receipt')}</div>`}
function productionView(){return `<div class="toolbar"><p class="muted" style="font-size:12px">Cada lote consume envases e insumos y acredita producto terminado al inventario.</p><button class="btn btn-primary" data-action="open-production">${icon('plus')} Nuevo lote</button></div><section class="card panel">${state.production.length?table(['Lote / Fecha','Producto','Cantidad','Parámetros de control','Responsable'],[...state.production].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(p=>`<tr><td><strong>${esc(p.code)}</strong><small>${fmtDate(p.createdAt)}</small></td><td>${esc(getP(p.productId)?.name||p.productName)}</td><td><strong>${num(p.qty)} un.</strong></td><td><span class="badge">Liberado</span><small>pH: ${p.ph==null?'—':esc(p.ph)} · TDS: ${p.tds==null?'—':esc(p.tds)} ppm</small></td><td>${esc(p.operator)}</td></tr>`).join('')):blank('No hay lotes registrados','Crea un lote para registrar envasado y consumo de materiales.','factory')}</section><p class="note">Importante: el marcado «Liberado» en esta aplicación es un registro administrativo; no reemplaza ensayos de laboratorio, aprobaciones de calidad ni requisitos regulatorios.</p>`}
function inventoryView(){const prods=state.products;const mats=state.materials;const low=lowAlerts();return `<div class="toolbar"><div class="filters"><button class="pill ${listsFilter==='all'?'active':''}" data-action="filter" data-id="all">Todo</button><button class="pill ${listsFilter==='products'?'active':''}" data-action="filter" data-id="products">Producto terminado</button><button class="pill ${listsFilter==='materials'?'active':''}" data-action="filter" data-id="materials">Envases e insumos</button></div><button class="btn btn-primary" data-action="open-adjustment">${icon('plus')} Movimiento</button></div>${low.length?`<div class="alert-card">${icon('alert')} Hay ${low.length} artículos con existencias iguales o inferiores al mínimo establecido.</div>`:''}<section class="card panel">${table(['Artículo','Tipo','Stock disponible','Mínimo','Estado','Acción'],[...(listsFilter==='materials'?[]:prods.map(p=>({...p,label:p.name,type:'producto',subtitle:p.sku}))),...(listsFilter==='products'?[]:mats.map(m=>({...m,label:m.name,type:'material',subtitle:m.id})))].map(x=>`<tr><td><strong>${esc(x.label)}</strong><small>${esc(x.subtitle)}</small></td><td>${x.type==='producto'?'Producto terminado':'Material / envase'}</td><td><strong>${num(x.stock)}</strong> un.</td><td>${num(x.minStock)}</td><td><span class="badge ${x.stock<=x.minStock?'pending':''}">${x.stock<=x.minStock?'Reponer':'Disponible'}</span></td><td><button type="button" class="btn btn-sm btn-outline" data-action="open-adjustment" data-type="${x.type}" data-id="${esc(x.id)}">Ajustar</button></td></tr>`).join(''))}</section><div style="margin-top:16px" class="card panel"><div class="section-bar"><h2>Últimos movimientos manuales</h2></div>${state.adjustments.length?table(['Fecha','Artículo','Variación','Motivo'],[...state.adjustments].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,12).map(a=>`<tr><td>${fmtDate(a.createdAt)}</td><td>${esc(a.label)}</td><td><strong>${a.delta>0?'+':''}${a.delta}</strong></td><td>${esc(a.reason)}</td></tr>`).join('')):blank('Sin ajustes manuales','Los cambios de inventario quedarán registrados aquí.','boxes')}</div>`}
function customersView(){return `<div class="toolbar"><p class="muted" style="font-size:12px">Saldo de botellones = entregados − retornados (incluidos dañados recibidos).</p><button class="btn btn-primary" data-action="open-customer">${icon('plus')} Nuevo cliente</button></div><section class="card panel">${table(['Cliente','Contacto','Botellones pendientes','Ventas','Acciones'],[...state.customers].map(c=>`<tr><td><strong>${esc(c.name)}</strong><small>${esc(c.address)}</small></td><td>${esc(c.phone||'—')}</td><td><span class="badge ${debt(c.id)>0?'pending':''}">${num(debt(c.id))} un.</span></td><td>${num(state.sales.filter(s=>s.customerId===c.id).length)}</td><td><button class="btn btn-sm btn-outline" data-action="open-customer" data-id="${esc(c.id)}">Editar</button> <button class="btn btn-sm btn-soft" data-action="open-return" data-id="${esc(c.id)}">Retorno</button></td></tr>`).join(''))}</section>`}
function returnsView(){const arr=[...state.returns].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const due=state.customers.filter(c=>debt(c.id)>0);return `<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0">${kpi('Botellones pendientes',num(sum(due,c=>debt(c.id))),'Por recuperar de clientes','refresh')}${kpi('Retornos registrados hoy',num(sum(state.returns.filter(x=>isToday(x.createdAt)),x=>x.good+x.damaged)),'Buenos + dañados','package')}</div><div class="toolbar"><p class="muted" style="font-size:12px">Los envases buenos vuelven a stock vacío; los dañados se separan.</p><button class="btn btn-primary" data-action="open-return">${icon('plus')} Registrar retorno</button></div><div class="view-grid"><section class="card panel"><div class="section-bar"><h2>En poder de clientes</h2></div>${due.length?table(['Cliente','Pendiente',''],due.map(c=>`<tr><td>${esc(c.name)}</td><td><span class="badge pending">${num(debt(c.id))} un.</span></td><td><button class="btn btn-sm btn-outline" data-action="open-return" data-id="${esc(c.id)}">Recibir</button></td></tr>`).join('')):blank('Sin botellones pendientes','Los saldos de todos los clientes están en cero.','check')}</section><section class="card panel"><div class="section-bar"><h2>Últimos retornos</h2></div>${arr.length?table(['Fecha','Cliente','Buenos','Dañados'],arr.slice(0,12).map(r=>`<tr><td>${fmtDate(r.createdAt)}</td><td>${esc(getC(r.customerId)?.name||'Cliente')}</td><td>${r.good}</td><td>${r.damaged}</td></tr>`).join('')):blank('Todavía no hay retornos','Los ingresos de botellones se muestran aquí.','refresh')}</section></div>`}
function monthMatch(d){return localDate(d).slice(0,7)===reportMonth}
function reportView(){const sales=state.sales.filter(s=>monthMatch(s.createdAt)),prod=state.production.filter(p=>monthMatch(p.createdAt)),rets=state.returns.filter(r=>monthMatch(r.createdAt)),coll=state.collections.filter(c=>monthMatch(c.createdAt));const revenue=sum(sales,s=>s.total);const receipts=sum(sales.filter(s=>s.initiallyPaid),s=>s.total)+sum(coll,x=>x.amount);const units=sum(sales,s=>sum(s.items,i=>i.qty));const byProduct=state.products.map(p=>({p,qty:sum(sales,s=>sum(s.items.filter(i=>i.productId===p.id),i=>i.qty))})).sort((a,b)=>b.qty-a.qty);const max=Math.max(1,...byProduct.map(a=>a.qty));return `<div class="toolbar"><label class="field" style="flex-direction:row;align-items:center"><span style="font-size:12px;font-weight:750">Período</span><input type="month" id="report-month" value="${esc(reportMonth)}" style="width:164px;min-height:38px"></label><div class="toolbar-right"><button class="btn btn-outline" data-action="csv">${icon('download')} Exportar ventas CSV</button></div></div><div class="kpis" style="margin-top:0">${kpi('Ventas facturadas',money(revenue),num(sales.length)+' ventas del período','wallet')}${kpi('Cobros recibidos',money(receipts),'Ventas al contado y recuperaciones','check')}${kpi('Unidades vendidas',num(units),'Productos despachados','shopping-bag')}${kpi('Unidades producidas',num(sum(prod,x=>x.qty)),'Lotes liberados','factory')}</div><div class="view-grid"><section class="card panel"><div class="section-bar"><h2>Ventas por producto</h2></div>${byProduct.some(x=>x.qty>0)?`<div class="bar-chart">${byProduct.filter(x=>x.qty>0).map(({p,qty})=>`<div class="bar-line"><span title="${esc(p.name)}">${esc(p.sku)}</span><div class="bar-track"><div class="bar-fill" style="width:${100*qty/max}%"></div></div><strong style="text-align:right">${num(qty)}</strong></div>`).join('')}</div>`:blank('Sin ventas en el período','Los gráficos aparecerán después de registrar ventas.','chart')}</section><section class="card panel"><div class="section-bar"><h2>Retornables y cobranza</h2></div><div class="stat-line"><span>Retornos buenos del mes</span><strong>${num(sum(rets,x=>x.good))}</strong></div><div class="stat-line"><span>Retornos dañados del mes</span><strong>${num(sum(rets,x=>x.damaged))}</strong></div><div class="stat-line"><span>Botellones aún por recuperar</span><strong>${num(sum(state.customers,c=>debt(c.id)))}</strong></div><div class="stat-line"><span>Saldo de ventas pendientes (total)</span><strong>${money(sum(state.sales.filter(s=>s.paymentStatus==='pending'),s=>s.total))}</strong></div><div class="stat-line"><span>Transacciones del período</span><strong>${num(sales.length)}</strong></div><p class="note">«Facturado» representa el valor de las ventas registradas; no implica emisión de factura tributaria. Los cobros pueden corresponder a ventas de meses anteriores.</p></section></div>`}
function settingsView(){return `<div class="settings-stack"><section class="card panel"><div class="section-bar"><h2>Datos del negocio</h2></div><form id="config-form" data-form="settings" class="form-grid">${field('Nombre del negocio','company','text',state.config.company,'required maxlength="80"')}${selectField('Moneda','currency',[['BOB','Bolivianos (Bs)'],['USD','Dólares (US$)'],['BRL','Reales (R$)']],state.config.currency)}${field('Responsable por defecto','operator','text',state.config.operator,'required maxlength="80"')}<div class="field"><label>Operación</label><div class="data-note">${state.meta.demo?'Datos de demostración':'Datos operativos locales'} · Guardado en este navegador</div></div><div class="field span-2">${footer('Guardar configuración')}</div></form></section><section class="card panel"><div class="section-bar"><div><h2>Productos y precios</h2><p>Activa, edita o crea nuevos productos.</p></div><button class="btn btn-primary" data-action="open-product">${icon('plus')} Producto</button></div>${table(['SKU / Producto','Formato','Precio','Stock','Estado','Acción'],state.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${esc(p.sku)}</small></td><td>${esc(PACKAGE[p.package].label)}</td><td>${money(p.price)}</td><td>${num(p.stock)}</td><td><span class="badge ${p.active?'':'pending'}">${p.active?'Activo':'Inactivo'}</span></td><td><button class="btn btn-sm btn-outline" data-action="open-product" data-id="${esc(p.id)}">Editar</button></td></tr>`).join(''))}</section><section class="card panel"><div class="section-bar"><h2>Datos y copias de seguridad</h2></div><p class="note" style="margin-top:0">Tus registros se guardan solo en el navegador utilizado. Un borrado del almacenamiento, el modo incógnito o un cambio de dispositivo pueden ocasionar pérdida de datos. Exporta un respaldo regularmente.</p><div class="toolbar-right"><button class="btn btn-soft" data-action="backup">${icon('download')} Descargar respaldo JSON</button><button class="btn btn-outline" data-action="restore">${icon('package')} Restaurar respaldo</button><button class="btn btn-outline" data-action="csv">${icon('download')} Exportar ventas CSV</button></div><input type="file" accept=".json,application/json" id="restore-file" hidden><div class="divider"></div>${state.meta.demo?`<div class="alert-card">${icon('alert')} Estás utilizando existencias y clientes de ejemplo. Inicia la operación real para limpiar los movimientos y dejar cantidades en cero.</div><button class="btn btn-danger" data-action="start-real">Iniciar operación real (limpiar demo)</button>`:`<p class="note">La operación real está activa. El restablecimiento de datos solo debe hacerse mediante respaldo y procedimientos administrativos controlados.</p>`}</section><section class="card panel"><div class="section-bar"><h2>Diagnóstico técnico</h2><button class="btn btn-outline btn-sm" data-action="diagnostics">Revisar integridad</button></div><div class="data-note">Versión 2.1 · ${num(diagnostics().records)} movimientos · Revisión de datos ${num(diagnostics().revision)} · ${diagnostics().issues.length?'<strong>Advertencias detectadas</strong>':'<strong>Conciliación interna correcta</strong>'}. Esta validación no reemplaza auditoría ni base de datos centralizada.</div></section><section class="card panel"><div class="section-bar"><h2>Alcance técnico y seguridad</h2></div><div class="data-note"><strong>Edición local / un solo equipo.</strong> Funciona sin servicios externos ni cuentas; no ofrece inicio de sesión, sincronización entre usuarios, permisos, facturación fiscal ni respaldo automático en la nube. Para desplegar en producción multiusuario es necesario integrar un backend seguro, políticas de acceso, auditoría del servidor, copias de seguridad y HTTPS.</div></section></div>`}
function render(){navBtns();document.getElementById('page-title').textContent=({'inicio':'Panel de control','tienda':'Tienda de agua','ventas':'Ventas y cobros','produccion':'Control de producción','inventario':'Inventario y materiales','clientes':'Cartera de clientes','retornos':'Botellones retornables','reportes':'Reportes de operación','ajustes':'Configuración'})[page];document.getElementById('today-label').textContent=fmtDay(now());document.getElementById('company-chip').textContent=state.config.company;const alerts=lowAlerts();document.getElementById('alerts-btn').innerHTML=icon('bell')+(alerts.length?'<i class="notification-dot"></i>':'');document.getElementById('logo-mark').innerHTML=icon('drop',24);document.getElementById('demo-banner').innerHTML=state.meta.demo?`<div class="demo-strip"><span><strong>MODO DEMOSTRACIÓN.</strong> Productos, existencias y clientes son ejemplos. Los movimientos que registres aquí también serán de prueba.</span><button data-nav="ajustes" type="button">Preparar datos reales →</button></div>`:'';document.getElementById('system-banner').innerHTML=startupError?`<div class="connection-banner">${esc(startupError)}</div>`:'';document.getElementById('view').innerHTML=({inicio:home,tienda:shop,ventas:salesView,produccion:productionView,inventario:inventoryView,clientes:customersView,retornos:returnsView,reportes:reportView,ajustes:settingsView})[page]();document.title='AQUACONTROL · '+document.getElementById('page-title').textContent}
function go(id){if(id==='more'){openMore();return}if(!NAV.some(n=>n[0]===id))return;page=id;listsFilter='all';if(id!=='tienda')search='';render();window.scrollTo({top:0,behavior:'instant'});try{history.replaceState(null,'','#'+id)}catch{}}
function toast(msg,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),5500)}
function modal(title,subtitle,content){document.getElementById('modal-title').textContent=title;document.getElementById('modal-subtitle').textContent=subtitle||'';document.getElementById('modal-content').innerHTML=content;document.getElementById('modal-error').classList.remove('show');document.getElementById('modal-error').textContent='';const dialog=document.getElementById('modal');if(!dialog.open)dialog.showModal()}
function closeModal(){document.getElementById('modal').close()}
function modalError(s){const e=document.getElementById('modal-error');e.textContent=s;e.classList.add('show');e.scrollIntoView({block:'nearest',behavior:'smooth'})}
function tryOp(fn,msg){try{fn();if(msg)toast(msg)}catch(e){if(document.getElementById('modal').open)modalError(e.message);else toast(e.message,true)}}
function code(prefix,list){const max=list.reduce((v,x)=>Math.max(v,Number((x.code||'').split('-').pop())||0),0);return prefix+'-'+String(max+1).padStart(5,'0')}
function openMore(){modal('Todos los módulos','Selecciona el área que deseas consultar',`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px">${NAV.map(([id,label,ic])=>`<button class="btn btn-outline" style="justify-content:flex-start;min-height:55px" data-action="modal-nav" data-id="${id}">${icon(ic)} ${esc(label)}</button>`).join('')}</div>`)}
function openAlerts(){const a=lowAlerts();modal('Centro de alertas','Revisa artículos con existencias críticas',a.length?a.map(x=>`<div class="alert-card">${icon('alert')} <span style="flex:1">${esc(x.label)}</span><button class="btn btn-sm btn-outline" data-action="modal-nav" data-id="${x.where}">Ver</button></div>`).join(''):blank('Sin alertas críticas','Los artículos están por encima de sus mínimos.','check'))}
function productionModal(){const active=state.products.filter(p=>p.active);if(!active.length)return toast('Primero registra un producto activo.',true);const p=active[0];modal('Registrar producción','Lote liberado, consumo de insumos y actualización de stock',`<form data-form="production"><div class="form-grid">${selectField('Producto elaborado','productId',active.map(p=>[p.id,`${p.name} (${PACKAGE[p.package].label})`]),p.id,'required')}${field('Cantidad terminada (un.)','qty','number','1','required min="1" step="1" max="1000000"')}${field('Responsable de producción','operator','text',state.config.operator,'required maxlength="80"')}${field('pH medido (opcional)','ph','number','','min="0" max="14" step="0.01" placeholder="Ej.: 7.20"')}${field('TDS medido, ppm (opcional)','tds','number','','min="0" max="100000" step="0.01" placeholder="Ej.: 80"')}<div class="field"><label for="f-note">Observaciones</label><input id="f-note" name="note" maxlength="260" placeholder="Muestreo, turno, equipo..."></div></div><div class="preview-box" id="recipe-preview">${recipeText(p,1)}</div><label class="inline-field" style="margin-top:16px;font-size:12px"><input name="approved" type="checkbox" required><span>Confirmo que el lote cuenta con autorización de liberación según los controles internos aplicables.</span></label>${footer('Liberar y registrar lote')}</form>`)}
function recipeText(p,qty){return `<strong>Consumo estimado para ${num(qty)} unidades:</strong><br>`+Object.entries(PACKAGE[p.package].needs).map(([id,n])=>{const m=getM(id);return `${esc(m?.name||id)}: <strong>${num(n*qty)}</strong> / disponible ${num(m?.stock||0)} ${m&&m.stock<n*qty?'⚠️':''}`}).join('<br>')+`<br><strong>Volumen estimado:</strong> ${num(PACKAGE[p.package].liters*qty)} L`}
function adjustmentModal(type='material',id=''){const options=(type==='producto'?state.products:state.materials).map(p=>[p.id,p.name]);if(!options.length)return toast('No existen artículos.',true);const chosen=options.some(o=>o[0]===id)?id:options[0][0];modal('Movimiento manual','Ingreso o egreso justificado de producto o insumos',`<form data-form="adjustment" class="form-grid">${selectField('Tipo de artículo','type',[['material','Envase / insumo'],['producto','Producto terminado']],type)}${selectField('Artículo','itemId',options,chosen)}${selectField('Movimiento','direction',[['in','Ingreso / inventario inicial'],['out','Salida / merma']], 'in')}${field('Cantidad (unidades)','qty','number','','required min="1" step="1" max="1000000"')}<div class="field span-2"><label for="f-reason">Motivo del movimiento</label><textarea name="reason" id="f-reason" required maxlength="300" placeholder="Ej.: compra OC-123, conteo físico, envase descartado..."></textarea></div><div class="field span-2"><div class="data-note">Los lotes y ventas generan sus movimientos automáticamente. Utiliza el ajuste solo para saldos iniciales, entradas externas, diferencias verificadas o bajas justificadas.</div></div><div class="field span-2">${footer('Guardar movimiento')}</div></form>`)}
function customerModal(id=''){const c=getC(id),editing=!!c;modal(editing?'Editar cliente':'Nuevo cliente','Datos básicos de contacto y seguimiento de retornables',`<form data-form="customer" data-id="${esc(id)}"><div class="form-grid">${field('Nombre o razón social','name','text',c?.name||'','required maxlength="100"')}${field('Teléfono / WhatsApp','phone','tel',c?.phone||'','maxlength="35"')}${field('Dirección / zona','address','text',c?.address||'','maxlength="160"')}<div class="field"><label>Botellones pendientes</label><div class="data-note">${editing?num(debt(id)):'0'} un.</div></div></div>${footer(editing?'Actualizar cliente':'Guardar cliente')}</form>`)}
function returnModal(id=''){const withDebt=state.customers.filter(c=>debt(c.id)>0);const selected=withDebt.some(c=>c.id===id)?id:withDebt[0]?.id;if(!selected)return toast('No hay botellones pendientes de clientes.',true);modal('Registrar retorno','Devolución por cliente con clasificación de estado',`<form data-form="return"><div class="form-grid">${selectField('Cliente','customerId',withDebt.map(c=>[c.id,`${c.name} · ${debt(c.id)} pendientes`]),selected,'required')}${field('Botellones buenos','good','number','1','min="0" step="1" max="1000000" required')}${field('Botellones dañados','damaged','number','0','min="0" step="1" max="1000000" required')}<div class="field"><label>Saldo del cliente</label><div class="data-note" id="debt-preview">${num(debt(selected))} botellones pendientes</div></div><div class="field span-2"><label for="f-returnNote">Observaciones</label><textarea id="f-returnNote" name="note" maxlength="260" placeholder="Estado de los envases, novedad o referencia"></textarea></div></div><div class="preview-box">Los buenos se incorporan a <strong>Botellones vacíos 20 L</strong>. Los dañados se registran separados, sin quedar disponibles para producción.</div>${footer('Registrar devolución')}</form>`)}
function productModal(id=''){const p=getP(id);modal(p?'Editar producto':'Crear producto','Precio por unidad, formato e inventario mínimo',`<form data-form="product" data-id="${esc(id)}"><div class="form-grid">${field('Nombre comercial','name','text',p?.name||'','required maxlength="100"')}${field('Código SKU','sku','text',p?.sku||'','required maxlength="30" pattern="[A-Za-z0-9_-]+" title="Solo letras, números, guiones y guion bajo"')}${selectField('Presentación / insumos','package',Object.entries(PACKAGE).map(([id,v])=>[id,v.label]),p?.package||'ret20','required')}${field('Precio de venta','price','number',p?.price??'','required min="0" max="10000000" step="0.01"')}${field('Alerta de stock mínimo','minStock','number',p?.minStock??20,'required min="0" step="1"')}<div class="field"><label>Estado</label><label class="inline-field" style="font-weight:500;margin-top:9px"><input type="checkbox" name="active" ${p?.active===false?'':'checked'}> Producto activo en catálogo</label></div></div>${p?`<div class="preview-box">Stock actual: ${num(p.stock)} un. Para modificar existencias utiliza un movimiento de inventario. Los cambios de presentación solo se aplican a lotes futuros.</div>`:''}${footer(p?'Guardar cambios':'Crear producto')}</form>`)}
function checkoutModal(){const lines=cartLines();if(!lines.length)return toast('Agrega al menos un producto.',true);if(lines.some(l=>l.qty>l.stock))return toast('El pedido excede existencias disponibles.',true);const retQty=sum(lines,l=>PACKAGE[l.package].returnable?l.qty:0);modal('Confirmar venta','Comprueba el cliente, el cobro y los envases recibidos',`<form data-form="checkout"><div class="form-grid">${selectField('Cliente','customerId',state.customers.map(c=>[c.id,c.name]),state.customers[0].id,'required')}${selectField('Forma de pago','paymentMethod',[['efectivo','Efectivo (pagado)'],['qr','QR (pagado)'],['transferencia','Transferencia (pagado)'],['credito','Venta a crédito (pendiente)']],'efectivo','required')}${field('Botellones 20 L recibidos en intercambio','returned','number','0','required min="0" step="1" max="1000000"')}<div class="field"><label>Referencia / entrega</label><input name="note" maxlength="200" placeholder="Ej.: pedido, ruta, repartidor..."></div></div><div class="preview-box"><strong>Detalle de venta</strong><div style="margin-top:8px">${lines.map(l=>`<div class="stat-line"><span>${esc(l.name)} · ${l.qty} un.</span><strong>${money(l.subtotal)}</strong></div>`).join('')}</div><div class="stat-line"><strong>Total a registrar</strong><strong>${money(cartTotal())}</strong></div><div class="stat-line"><span>Envases retornables que se entregarán</span><strong>${retQty}</strong></div><div style="margin-top:8px" id="checkout-debt">Saldo actual del cliente: ${num(debt(state.customers[0].id))} botellones · máximo retornable en este pedido: ${num(debt(state.customers[0].id)+retQty)}</div></div>${footer('Confirmar venta y descontar stock')}</form>`)}
function saleDetail(id){const s=state.sales.find(s=>s.id===id);if(!s)return;const c=getC(s.customerId);modal('Comprobante interno '+s.code,'Registro de venta · '+fmtDate(s.createdAt),`<section id="receipt-print"><div class="section-bar"><h2>${esc(state.config.company)}</h2><span class="badge ${s.paymentStatus==='pending'?'pending':''}">${s.paymentStatus==='pending'?'Pendiente de cobro':'Pagado'}</span></div><div class="stat-line"><span>Cliente</span><strong>${esc(c?.name||'No encontrado')}</strong></div><div class="stat-line"><span>Teléfono</span><strong>${esc(c?.phone||'—')}</strong></div><div class="stat-line"><span>Método de pago</span><strong>${esc(s.paymentMethod)}</strong></div>${table(['Producto','Cantidad','Precio unit.','Subtotal'],s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price,s.currency||state.config.currency)}</td><td>${money(i.price*i.qty,s.currency||state.config.currency)}</td></tr>`).join(''))}<div class="stat-line"><span>Total</span><strong style="font-size:19px">${money(s.total,s.currency||state.config.currency)}</strong></div><div class="stat-line"><span>Envases 20 L entregados</span><strong>${soldReturnable(s)}</strong></div><div class="stat-line"><span>Envases recibidos en intercambio</span><strong>${s.returnsReceived||0}</strong></div><p class="note">${esc(s.note||'Sin observaciones')}<br><strong>Comprobante administrativo interno. No es factura fiscal.</strong></p></section><div class="form-footer no-print"><button class="btn btn-outline" data-action="close-modal">Cerrar</button><button class="btn btn-primary" data-action="print">Imprimir</button></div>`)}
function collectModal(id){const s=state.sales.find(s=>s.id===id);if(!s||s.paymentStatus!=='pending')return toast('La venta ya fue pagada o no existe.',true);modal('Registrar cobro','Liquidación completa de la venta '+s.code,`<form data-form="collection" data-id="${esc(id)}"><div class="preview-box">Cliente: <strong>${esc(getC(s.customerId)?.name||'Cliente')}</strong><br>Importe pendiente: <strong>${money(s.total)}</strong><br>Se registrará un pago total; no se admiten abonos parciales en esta edición.</div><div style="margin-top:15px">${selectField('Medio de cobro','method',[['efectivo','Efectivo'],['qr','QR'],['transferencia','Transferencia']],'efectivo')}</div>${footer('Confirmar cobro de '+money(s.total))}</form>`)}
function positiveInt(v,name){const x=int(v);if(!Number.isSafeInteger(x)||x<=0||x>1000000)throw Error(name+': ingresa un número entero entre 1 y 1.000.000.');return x}
function zeroInt(v,name){const x=int(v);if(!Number.isSafeInteger(x)||x>1000000)throw Error(name+': ingresa un número entero válido.');return x}
function txt(v,max,label,required=false){const s=String(v||'').trim();if((required&&!s)||s.length>max)throw Error(label+': valor obligatorio o demasiado largo.');return s}
function amount(v,label){if(v===null||String(v).trim()==='')throw Error(label+' es obligatorio.');const n=Number(v);if(!Number.isFinite(n)||n<0||n>10000000||Math.round(n*100)/100!==n)throw Error(label+' debe ser un importe no negativo con máximo dos decimales.');return n}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function onForm(f){const kind=f.dataset.form;const d=formData(f);switch(kind){
case 'production':{const p=getP(d.productId),qty=positiveInt(d.qty,'Cantidad');if(!p||!p.active)throw Error('Producto no disponible.');if(!f.querySelector('[name=approved]').checked)throw Error('Se requiere confirmación de liberación del lote.');const operator=txt(d.operator,80,'Responsable',true),note=txt(d.note,260,'Observaciones');const ph=d.ph===''?null:Number(d.ph),tds=d.tds===''?null:Number(d.tds);if(ph!==null&&(!Number.isFinite(ph)||ph<0||ph>14))throw Error('El pH debe estar entre 0 y 14.');if(tds!==null&&(!Number.isFinite(tds)||tds<0||tds>100000))throw Error('TDS fuera de rango.');for(const [mid,ratio] of Object.entries(PACKAGE[p.package].needs)){const m=getM(mid);if(!m||m.stock<ratio*qty)throw Error('No hay stock suficiente de '+(m?.name||mid)+'. Disponible: '+(m?.stock||0)+'; requerido: '+ratio*qty+'.')}commit(s=>{const prod=s.products.find(x=>x.id===p.id);if(!prod||!prod.active||prod.package!==p.package)throw Error('El producto cambió; revisa el lote.');for(const [mid,ratio] of Object.entries(PACKAGE[prod.package].needs)){const mat=s.materials.find(x=>x.id===mid);if(!mat||mat.stock<ratio*qty)throw Error('Stock insuficiente o modificado para '+(mat?.name||mid));}prod.stock+=qty;for(const [mid,ratio] of Object.entries(PACKAGE[prod.package].needs))s.materials.find(x=>x.id===mid).stock-=ratio*qty;s.production.push({id:uid(),code:code('LOT',s.production),createdAt:now(),productId:p.id,productName:p.name,qty,operator,note,ph,tds,liters:qty*PACKAGE[p.package].liters,consumed:cloneState(PACKAGE[p.package].needs),status:'released'})});closeModal();toast('Lote registrado: '+num(qty)+' unidades. Inventario actualizado.');go('produccion');break}
case 'adjustment':{if(!['producto','material'].includes(d.type))throw Error('Tipo no válido.');const list=d.type==='producto'?state.products:state.materials;const item=list.find(x=>x.id===d.itemId);if(!item)throw Error('El artículo no existe.');const qty=positiveInt(d.qty,'Cantidad'),dir=d.direction==='in'?1:d.direction==='out'?-1:0;if(!dir)throw Error('Dirección inválida.');const reason=txt(d.reason,300,'Motivo',true);if(item.stock+dir*qty<0)throw Error('Inventario insuficiente: '+item.stock+' unidades disponibles.');commit(s=>{const collection=d.type==='producto'?s.products:s.materials;const target=collection.find(x=>x.id===d.itemId);if(!target||!Number.isSafeInteger(target.stock+dir*qty)||target.stock+dir*qty<0)throw Error('Existencia insuficiente o movimiento fuera de rango.');target.stock+=dir*qty;s.adjustments.push({id:uid(),createdAt:now(),type:d.type,itemId:d.itemId,label:item.name,delta:dir*qty,reason})});closeModal();toast('Movimiento registrado correctamente.');go('inventario');break}
case 'customer':{const name=txt(d.name,100,'Nombre',true),phone=txt(d.phone,35,'Teléfono'),address=txt(d.address,160,'Dirección'),id=f.dataset.id;commit(s=>{if(id){const c=s.customers.find(x=>x.id===id);if(!c)throw Error('El cliente ya no existe.');Object.assign(c,{name,phone,address})}else{s.customers.push({id:uid(),name,phone,address,createdAt:now()})}});closeModal();toast('Cliente guardado.');go('clientes');break}
case 'return':{const c=getC(d.customerId);if(!c)throw Error('Selecciona un cliente.');const good=zeroInt(d.good,'Botellones buenos'),damaged=zeroInt(d.damaged,'Dañados');if(good+damaged<=0)throw Error('Debes recibir al menos un envase.');if(good+damaged>debt(c.id))throw Error('No puedes recibir más botellones de los '+debt(c.id)+' pendientes.');const note=txt(d.note,260,'Observaciones');commit(s=>{const sold=sum(s.sales.filter(x=>x.customerId===c.id),x=>sum(x.items,i=>PACKAGE[i.package]?.returnable?i.qty:0));const back=sum(s.returns.filter(x=>x.customerId===c.id),x=>x.good+x.damaged);if(good+damaged>sold-back)throw Error('El saldo de retornables cambió. Revisa la operación.');s.materials.find(x=>x.id==='envase20').stock+=good;s.materials.find(x=>x.id==='danados').stock+=damaged;s.returns.push({id:uid(),customerId:c.id,good,damaged,note,createdAt:now(),saleId:null})});closeModal();toast('Retorno contabilizado: '+(good+damaged)+' botellones.');go('retornos');break}
case 'product':{const name=txt(d.name,100,'Nombre',true),sku=txt(d.sku,30,'SKU',true).toUpperCase();if(!/^[A-Z0-9_-]+$/.test(sku))throw Error('SKU: solo letras, números, guiones y guion bajo.');const pack=d.package;if(!PACKAGE[pack])throw Error('Formato no compatible.');const price=amount(d.price,'Precio'),minStock=zeroInt(d.minStock,'Mínimo'),active=f.querySelector('[name=active]').checked,id=f.dataset.id;if(state.products.some(p=>p.sku.toUpperCase()===sku&&p.id!==id))throw Error('Ese código SKU ya existe.');if(id&&getP(id)?.package!==pack&&(getP(id)?.stock>0||state.production.some(x=>x.productId===id)||state.sales.some(x=>x.items.some(y=>y.productId===id))))throw Error('No puedes cambiar la presentación de un producto con stock o historial de operaciones. Crea un SKU nuevo.');commit(s=>{if(id){const p=s.products.find(x=>x.id===id);if(!p)throw Error('No existe el producto.');Object.assign(p,{name,sku,package:pack,price,minStock,active})}else{s.products.push({id:uid(),name,sku,package:pack,price,minStock,stock:0,active})}});closeModal();toast('Producto guardado.');go('ajustes');break}
case 'checkout':{const c=getC(d.customerId);if(!c)throw Error('Cliente no válido.');const lines=cartLines();if(!lines.length)throw Error('Carrito vacío.');for(const l of lines)if(l.qty>getP(l.id).stock)throw Error('Inventario insuficiente de '+l.name+'.');const pm=d.paymentMethod;if(!['efectivo','transferencia','qr','credito'].includes(pm))throw Error('Medio de pago inválido.');const returned=zeroInt(d.returned,'Retornados'),retSold=sum(lines,l=>PACKAGE[l.package].returnable?l.qty:0);if(returned>debt(c.id)+retSold)throw Error('Solo puedes recibir hasta '+(debt(c.id)+retSold)+' botellones de este cliente (saldo previo + entregados hoy).');const note=txt(d.note,200,'Referencia'),total=Math.round(sum(lines,l=>l.price*l.qty)*100)/100;let recordedCode='';commit(s=>{const sold=sum(s.sales.filter(x=>x.customerId===c.id),x=>sum(x.items,i=>PACKAGE[i.package]?.returnable?i.qty:0));const back=sum(s.returns.filter(x=>x.customerId===c.id),x=>x.good+x.damaged);if(returned>sold-back+retSold)throw Error('Saldo de retornables modificado. Revisa la venta.');for(const l of lines){const p=s.products.find(x=>x.id===l.id);if(!p||!p.active||p.stock<l.qty||p.price!==l.price||p.package!==l.package)throw Error('Producto, precio o stock modificado: revisa '+l.name);p.stock-=l.qty}const id=uid(),createdAt=now();recordedCode=code('VTA',s.sales);s.sales.push({id,code:recordedCode,createdAt,customerId:c.id,items:lines.map(l=>({productId:l.id,sku:l.sku,name:l.name,package:l.package,qty:l.qty,price:l.price})),total,currency:s.config.currency,paymentStatus:pm==='credito'?'pending':'paid',paymentMethod:pm,note,returnsReceived:returned,initiallyPaid:pm!=='credito'});if(returned>0){s.materials.find(x=>x.id==='envase20').stock+=returned;s.returns.push({id:uid(),customerId:c.id,good:returned,damaged:0,createdAt,note:'Intercambio en venta '+recordedCode,saleId:id})}});cart={};closeModal();toast('Venta '+recordedCode+' registrada. Stock y retornables actualizados.');go('ventas');break}
case 'collection':{const id=f.dataset.id,s=state.sales.find(x=>x.id===id);if(!s||s.paymentStatus!=='pending')throw Error('La venta no está pendiente.');if(!['efectivo','transferencia','qr'].includes(d.method))throw Error('Método de pago no válido.');commit(draft=>{const x=draft.sales.find(x=>x.id===id);if(x.paymentStatus!=='pending')throw Error('La venta ya se cobró.');x.paymentStatus='paid';x.paymentMethod=d.method;x.paidAt=now();draft.collections.push({id:uid(),saleId:id,amount:x.total,method:d.method,createdAt:x.paidAt})});closeModal();toast('Cobro total registrado.');go('ventas');break}
case 'settings':{const company=txt(d.company,80,'Empresa',true),operator=txt(d.operator,80,'Responsable',true);if(!['BOB','USD','BRL'].includes(d.currency))throw Error('Moneda no admitida.');if(d.currency!==state.config.currency&&state.sales.length)throw Error('No se permite cambiar la moneda cuando existen ventas registradas: mezclar importes de distintas monedas distorsionaría los reportes.');commit(s=>{Object.assign(s.config,{company,operator,currency:d.currency})});toast('Configuración guardada.');go('ajustes');break}
default:throw Error('Formulario no reconocido.')}}
function download(name,content,mime){const b=new Blob([content],{type:mime}),url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function backup(){try{download('AQUACONTROL_respaldo_'+localDate()+'.json',JSON.stringify(state,null,2),'application/json');toast('Respaldo generado. Guárdalo en un lugar seguro.')}catch(e){toast('No fue posible descargar el respaldo: '+e.message,true)}}
const csvSafe=x=>{let s=String(x??'');if(/^[\s\t]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
function salesCsv(){const rows=[['Código','Fecha','Cliente','SKU','Producto','Cantidad','Precio unidad','Subtotal','Moneda','Estado','Forma de pago','Botellones retornados en entrega']];for(const s of state.sales)for(const it of s.items){const p=getP(it.productId);rows.push([s.code,s.createdAt,getC(s.customerId)?.name||'',it.sku||p?.sku||'',it.name,it.qty,it.price,Number((it.price*it.qty).toFixed(2)),s.currency||state.config.currency,s.paymentStatus,s.paymentMethod,s.returnsReceived||0])}download('AQUACONTROL_ventas_'+localDate()+'.csv','\ufeff'+rows.map(row=>row.map(csvSafe).join(';')).join('\r\n'),'text/csv;charset=utf-8;');toast('Ventas exportadas en CSV.');}
function runDiagnostics(){const d=diagnostics();const report=['AQUACONTROL 2.1 — Diagnóstico técnico','Fecha: '+now(),'Revisión: '+d.revision,'Movimientos: '+d.records,'Observaciones: '+d.issues.length,...d.issues.map(x=>'- '+x),'','Alcance: validación local de integridad; no certifica controles de calidad, tributación ni concurrencia multiusuario.'];download('AQUACONTROL_diagnostico_'+localDate()+'.txt',report.join('\n'),'text/plain;charset=utf-8');toast(d.issues.length?'Diagnóstico descargado con '+d.issues.length+' alertas.':'Diagnóstico descargado sin inconsistencias detectadas.',!!d.issues.length)}
function startReal(){if(!state.meta.demo)return;const okay=confirm('Se eliminarán los movimientos de prueba y TODOS los saldos de ejemplo pasarán a cero. Se mantendrá el catálogo y sus precios. ¿Ya descargaste el respaldo?');if(!okay)return;commit(s=>{s.meta.demo=false;s.production=[];s.sales=[];s.returns=[];s.adjustments=[];s.collections=[];s.customers=s.customers.filter(c=>c.id==='c0');for(const p of s.products)p.stock=0;for(const m of s.materials)m.stock=0});cart={};toast('Operación real preparada: saldos en cero. Registra inventario inicial.');go('inventario')}
async function restoreFile(file){if(!file)return;if(file.size>5_000_000)throw Error('El respaldo no puede exceder 5 MB en esta edición.');const text=typeof file.text==="function"?await file.text():await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error("No se pudo leer el archivo"));reader.readAsText(file)});let obj;try{obj=JSON.parse(text)}catch{throw Error('El archivo seleccionado no es un JSON válido.')}validateState(obj);if(!confirm('Esto reemplazará los datos actuales de AQUACONTROL en este navegador. ¿Deseas continuar?'))return;obj.rev=Math.max(state.rev||0,obj.rev||0)+1;obj.meta.updatedAt=now();try{localStorage.setItem(STORE_KEY,JSON.stringify(obj))}catch(e){throw Error('No se pudo restaurar: memoria del navegador insuficiente o bloqueada.')}state=obj;startupError='';cart={};page='inicio';search='';render();toast('Respaldo restaurado correctamente.')}
function changeQty(id,delta){const p=getP(id);if(!p||!p.active)return toast('Producto no disponible.',true);const q=Math.max(0,Math.min(p.stock,(cart[id]||0)+delta));if(q===(cart[id]||0)&&delta>0)return toast('No hay más unidades disponibles de '+p.name,true);cart[id]=q;render()}
function reviewAdjustItems(type,form){const list=type==='producto'?state.products:state.materials;const sel=form.querySelector('[name=itemId]');if(sel)sel.innerHTML=list.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('')}
function updatePreview(form){if(form.dataset.form==='production'){const p=getP(form.querySelector('[name=productId]').value);const q=Number(form.querySelector('[name=qty]').value)||0;document.getElementById('recipe-preview').innerHTML=p?recipeText(p,Math.max(0,Math.floor(q))):''}else if(form.dataset.form==='return'){const c=form.querySelector('[name=customerId]');const out=document.getElementById('debt-preview');if(out)out.textContent=num(debt(c.value))+' botellones pendientes'}else if(form.dataset.form==='checkout'){const c=form.querySelector('[name=customerId]'),out=document.getElementById('checkout-debt');const total=sum(cartLines(),l=>PACKAGE[l.package].returnable?l.qty:0);if(out)out.textContent='Saldo actual del cliente: '+num(debt(c.value))+' botellones · máximo retornable en este pedido: '+num(debt(c.value)+total)}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();go(nav.dataset.nav);return}const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id||'';if(action==='search')return;
try{switch(action){case 'qty':changeQty(id,Number(btn.dataset.delta));break;case 'category':category=id;render();break;case 'clear-cart':cart={};render();break;case 'checkout':checkoutModal();break;case 'open-production':productionModal();break;case 'open-adjustment':adjustmentModal(btn.dataset.type||'material',id);break;case 'open-customer':customerModal(id);break;case 'open-return':returnModal(id);break;case 'open-product':productModal(id);break;case 'sale-detail':saleDetail(id);break;case 'collect':collectModal(id);break;case 'alerts':openAlerts();break;case 'close-modal':closeModal();break;case 'modal-nav':closeModal();go(id);break;case 'backup':backup();break;case 'diagnostics':runDiagnostics();break;case 'restore':document.getElementById('restore-file')?.click();break;case 'csv':salesCsv();break;case 'start-real':startReal();break;case 'print':window.print();break;default:break}}catch(err){toast(err.message,true)}});
document.addEventListener('submit',e=>{if(!e.target.matches('form[data-form]'))return;e.preventDefault();if(busy)return;busy=true;try{onForm(e.target)}catch(err){if(document.getElementById('modal').open)modalError(err.message);else toast(err.message,true)}finally{busy=false}});
document.addEventListener('input',e=>{if(e.target.id==='shop-search'){const pos=e.target.selectionStart;search=e.target.value;render();const a=document.getElementById('shop-search');if(a){a.focus();try{a.setSelectionRange(pos,pos)}catch{}}return}const form=e.target.closest('form[data-form]');if(form)updatePreview(form)});
document.addEventListener('change',e=>{if(e.target.id==='report-month'){if(/^\d{4}-\d{2}$/.test(e.target.value)){reportMonth=e.target.value;render()}return}if(e.target.id==='restore-file'){const f=e.target.files?.[0];e.target.value='';restoreFile(f).catch(err=>toast(err.message,true));return}const form=e.target.closest('form[data-form]');if(!form)return;if(form.dataset.form==='adjustment'&&e.target.name==='type')reviewAdjustItems(e.target.value,form);updatePreview(form)});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('storage',e=>{if(e.key!==STORE_KEY)return;try{if(!e.newValue){toast('Los datos se eliminaron desde otra pestaña. Recarga para continuar.',true);return}const updated=JSON.parse(e.newValue);validateState(updated);state=updated;startupError='';render();toast('Datos actualizados desde otra pestaña.')}catch{toast('Se detectó un cambio de almacenamiento inválido.',true)}});
window.addEventListener('error',e=>{console.error('AquaControl error',e.message);toast('Ha ocurrido un problema inesperado. No se modificaron tus registros.',true)});
const hash=location.hash.slice(1);if(NAV.some(x=>x[0]===hash))page=hash;render();
</script>
